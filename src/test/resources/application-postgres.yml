spring:
  application:
    name: cricauction-backbone-db-automation
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cricauction}
    username: ${DB_USER:yogeshkumarpadhiyar}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 85
      minimum-idle: 35
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 5000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 500
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: false

cricauction:
  security:
    bcrypt-strength: 6 # Optimized work factor for massive 5k-10k concurrent automation
    jwt:
      secret: cricauction_very_long_secure_secret_key_that_exceeds_256_bits_for_hmac_sha256!
      access-token-expiration-ms: 86400000
      refresh-token-expiration-ms: 604800000
    google:
      client-id: test-client-id
    otp:
      expiration-seconds: 300
      retry-after-seconds: 0 # Zero cooldown for rapid bulk automation
      length: 6
    password-reset:
      token-expiration-minutes: 15
