server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 10000
    accept-count: 5000
    connection-timeout: 20000

spring:
  application:
    name: cricauction-backbone

  threads:
    virtual:
      enabled: true

  datasource:
    # Master / Primary Database Connection (Handles Writes, Mutating Transactions, and DDL Migrations)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cricauction}
    username: ${DB_USER:yogeshkumarpadhiyar}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: CricAuction-Master-Pool
      maximum-pool-size: 50
      minimum-idle: 25
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 10000
      leak-detection-threshold: 2000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true

    # Read Replica Database Connection (Handles @Transactional(readOnly = true) queries)
    replica:
      url: jdbc:postgresql://${DB_REPLICA_HOST:${DB_HOST:localhost}}:${DB_REPLICA_PORT:${DB_PORT:5432}}/${DB_REPLICA_NAME:${DB_NAME:cricauction}}
      username: ${DB_REPLICA_USER:${DB_USER:yogeshkumarpadhiyar}}
      password: ${DB_REPLICA_PASSWORD:${DB_PASSWORD:}}
      driver-class-name: org.postgresql.Driver
      hikari:
        pool-name: CricAuction-Replica-Pool
        read-only: true
        maximum-pool-size: 50
        minimum-idle: 25
        idle-timeout: 300000
        max-lifetime: 1800000
        connection-timeout: 10000
        leak-detection-threshold: 2000
        data-source-properties:
          cachePrepStmts: true
          prepStmtCacheSize: 250
          prepStmtCacheSqlLimit: 2048
          useServerPrepStmts: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

cricauction:
  auth:
    cleanup-cron: ${AUTH_CLEANUP_CRON:0 0 * * * *}
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:10}
    jwt:
      secret: ${JWT_SECRET:cricauction_very_long_secure_secret_key_that_exceeds_256_bits_for_hmac_sha256!}
      access-token-expiration-ms: 86400000 # 24 hours (86400s)
      refresh-token-expiration-ms: 604800000 # 7 days
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,https://*.cricauction.app,https://*.cricauction.com}
    rate-limit:
      bypass-enabled: ${RATE_LIMIT_BYPASS_ENABLED:false}
      trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:false}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      allow-mock-tokens: ${GOOGLE_ALLOW_MOCK_TOKENS:false}
    otp:
      expiration-seconds: 300
      retry-after-seconds: 45
      length: 6
    password-reset:
      token-expiration-minutes: 15

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
